appId: com.shiftk.app
productName: Shift-K
copyright: Copyright © 2026 Hadrien Durand-Baissas

directories:
  buildResources: electron/resources
  output: release

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - dist/core/**/*
  - dist/shared/**/*
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.test.js"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shift-K
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: electron/resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/resources/entitlements.mac.plist
  entitlementsInherit: electron/resources/entitlements.mac.plist
  notarize:
    teamId: PLACEHOLDER_TEAM_ID
  extendInfo:
    LSUIElement: true
    NSDownloadsFolderUsageDescription: Shift-K surveille votre dossier Téléchargements pour router automatiquement les fichiers générés par les plateformes IA vers vos dossiers projet.

dmg:
  title: Shift-K ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish: null
