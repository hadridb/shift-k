appId: com.shiftk.app
productName: Shift-K
copyright: Copyright © 2026 Hadrien Durand-Baissas

directories:
  buildResources: electron/resources
  output: release

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - "!**/*.map"
  - "!**/*.d.ts"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shift-K
  deleteAppDataOnUninstall: false

publish: null
