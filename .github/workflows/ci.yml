name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, build, test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build main
        run: npm run build:main

      - name: Build renderer
        run: npm run build:renderer

      - name: Test
        run: npm test

      - name: Package installer
        run: npm run dist

      - name: Smoke — dist/core/config/store.js exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/core/config/store.js")) {
            Write-Error "dist/core/config/store.js missing — main process import will fail at runtime"
            exit 1
          }

      - name: Smoke — asar contains core/config/store (see ADR-022)
        shell: pwsh
        run: |
          $entries = npx --yes asar list release/win-unpacked/resources/app.asar
          if (-not ($entries | Select-String -SimpleMatch "dist\core\config\store.js")) {
            Write-Error "core/config/store.js not packaged in app.asar — check files: globs in electron-builder.yml"
            exit 1
          }
